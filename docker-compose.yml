services:
  postgres:
    image: postgres:16-alpine
    container_name: youflicks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: youflicks
      POSTGRES_PASSWORD: youflicks
      POSTGRES_DB: youflicks
    ports:
      - "5432:5432"
    volumes:
      - youflicks_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youflicks -d youflicks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  youflicks_pg:
